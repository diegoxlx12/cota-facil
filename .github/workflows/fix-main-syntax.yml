name: Fix main.jsx syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/main.jsx')
          s = p.read_text()
          old = "new Notification(title,{body:message)})"
          new = "new Notification(title,{body:message})"
          if old in s:
              p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No fix needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.jsx
          git commit -m "Fix main.jsx popup syntax"
          git push
